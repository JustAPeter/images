
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500">

  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151a" stop-opacity=".91"/>
      <stop offset="1" stop-color="#080c10" stop-opacity=".72"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#ff5b26"/>
    </linearGradient>

    <pattern id="microgrid" width="20" height="20"
             patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none"
            stroke="#d4d9d9" stroke-opacity=".09"
            stroke-width=".6"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: monospace; }
      .white { fill: #e8e8df; }
      .muted { fill: #8f9b9c; }
      .amber { fill: #ffb52e; }
      .red { fill: #ff493e; }
      .cyan { fill: #7bdedb; }
      .line { fill: none; stroke: #d9dfda; stroke-opacity: .55; }
      .hairline { fill: none; stroke: #d9dfda; stroke-opacity: .25; }
      .tiny { font-size: 9px; letter-spacing: 1px; }
      .small { font-size: 11px; letter-spacing: .6px; }
      .label { font-size: 13px; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Transparent canvas: intentionally no background rectangle -->

  <!-- Global framing -->
  <g class="line" stroke-width="1">
    <path d="M24 66V24H66 M1134 24H1176V66"/>
    <path d="M24 434V476H66 M1134 476H1176V434"/>
    <path d="M24 100H34 M24 120H30 M24 140H34
             M1176 100H1166 M1176 120H1170 M1176 140H1166"/>
  </g>

  <!-- Top command strip -->
  <g>
    <path d="M40 30H440L453 43V78H40Z"
          fill="url(#glass)" stroke="#d9dfda"
          stroke-opacity=".65"/>

    <path d="M40 30H440L453 43H40Z"
          fill="#e6e5db" fill-opacity=".12"/>

    <rect x="40" y="30" width="5" height="48"
          fill="url(#amber)"/>

    <text x="56" y="48" class="mono amber small">
      NERV // DEVELOPER OPERATIONS
    </text>
    <text x="56" y="66" class="mono white label">
      SYSTEM INTERFACE 01
    </text>
  </g>

  <!-- Left diagnostic rail -->
  <g>
    <path d="M40 101H245L257 113V304H40Z"
          fill="url(#glass)" stroke="#d9dfda"
          stroke-opacity=".42"/>

    <path d="M40 101H245L257 113H40Z"
          fill="#d9dfda" fill-opacity=".1"/>

    <text x="53" y="120" class="mono amber small">
      01 / SYSTEM DIAGNOSTICS
    </text>
    <path d="M52 130H243" class="hairline"/>

    <text x="53" y="149" class="mono muted tiny">
      RENDER PIPELINE
    </text>
    <text x="53" y="165" class="mono white small">
      FRAME STATUS
    </text>
    <text x="243" y="165" class="mono cyan tiny"
          text-anchor="end">STABLE</text>

    <rect x="53" y="175" width="190" height="4"
          fill="#d9dfda" fill-opacity=".13"/>
    <rect x="53" y="175" width="151" height="4"
          fill="#7bdedb"/>

    <text x="53" y="201" class="mono muted tiny">
      TYPE CHECKER
    </text>
    <text x="53" y="217" class="mono white small">
      STRICT MODE
    </text>
    <text x="243" y="217" class="mono amber tiny"
          text-anchor="end">ENABLED</text>

    <rect x="53" y="227" width="190" height="4"
          fill="#d9dfda" fill-opacity=".13"/>
    <rect x="53" y="227" width="180" height="4"
          fill="#ffb52e"/>

    <text x="53" y="253" class="mono muted tiny">
      BUILD PIPELINE
    </text>
    <text x="53" y="269" class="mono white small">
      DEPENDENCIES
    </text>
    <text x="243" y="269" class="mono cyan tiny"
          text-anchor="end">RESOLVED</text>

    <path d="M53 283H243" stroke="#7bdedb"
          stroke-opacity=".65"/>
    <text x="53" y="297" class="mono muted tiny">
      NO CRITICAL FAULTS DETECTED
    </text>
  </g>

  <!-- Right code terminal -->
  <g>
    <path d="M880 101H1148L1160 113V305H880Z"
          fill="url(#glass)" stroke="#d9dfda"
          stroke-opacity=".5"/>

    <path d="M880 101H1148L1160 113H880Z"
          fill="#d9dfda" fill-opacity=".12"/>

    <rect x="880" y="101" width="4" height="204"
          fill="url(#amber)"/>

    <text x="895" y="120" class="mono amber small">
      02 / SOURCE VIEW
    </text>
    <text x="1146" y="120" class="mono muted tiny"
          text-anchor="end">TSX</text>

    <path d="M894 130H1146" class="hairline"/>

    <g class="mono" font-size="10.5">
      <text x="895" y="149" class="muted">01</text>
      <text x="918" y="149" fill="#d3a5ff">const</text>
      <text x="953" y="149" class="white">system = {</text>

      <text x="895" y="166" class="muted">02</text>
      <text x="918" y="166" class="cyan">  framework:</text>
      <text x="992" y="166" fill="#b5e59a">'React',</text>

      <text x="895" y="183" class="muted">03</text>
      <text x="918" y="183" class="cyan">  runtime:</text>
      <text x="979" y="183" fill="#b5e59a">'Next.js',</text>

      <text x="895" y="200" class="muted">04</text>
      <text x="918" y="200" class="cyan">  language:</text>
      <text x="984" y="200" fill="#b5e59a">'TypeScript',</text>

      <text x="895" y="217" class="muted">05</text>
      <text x="918" y="217" class="white">  online:</text>
      <text x="974" y="217" fill="#ffb52e">true</text>
      <text x="1000" y="217" class="white">,</text>

      <text x="895" y="234" class="muted">06</text>
      <text x="918" y="234" class="white">};</text>

      <text x="895" y="260" class="muted">07</text>
      <text x="918" y="260" fill="#d3a5ff">await</text>
      <text x="954" y="260" class="white">system.initialize();</text>

      <text x="895" y="286" class="muted">08</text>
      <text x="918" y="286" fill="#7bdedb">
        // all systems operational_
      </text>
    </g>
  </g>

  <!-- Lower telemetry band -->
  <g>
    <path d="M40 329H1160V457H40Z"
          fill="url(#glass)" stroke="#d9dfda"
          stroke-opacity=".42"/>

    <path d="M40 329H1160V354H40Z"
          fill="#d9dfda" fill-opacity=".1"/>

    <rect x="40" y="329" width="1120" height="2"
          fill="url(#amber)"/>

    <text x="54" y="346" class="mono amber small">
      03 / LIVE TELEMETRY
    </text>
    <text x="1145" y="346" class="mono muted tiny"
          text-anchor="end">
      DEV NODE // 07
    </text>

    <!-- Performance waveform -->
    <g transform="translate(55 365)">
      <text x="0" y="10" class="mono muted tiny">
        PERFORMANCE TRACE
      </text>
      <path d="M0 63H330 M0 43H330 M0 23H330"
            stroke="#d9dfda" stroke-opacity=".13"
            stroke-dasharray="3 5"/>

      <path d="M0 49L18 47L31 52L46 29L60 36L76 22
               L91 42L106 39L122 48L138 19L153 28
               L168 23L184 42L199 35L214 46L230 15
               L245 31L260 27L277 39L293 22L310 28L330 17"
            fill="none" stroke="#7bdedb"
            stroke-width="1.8" filter="url(#softGlow)"/>

      <text x="0" y="83" class="mono cyan tiny">
        RENDER / STABLE
      </text>
    </g>

    <!-- Build status -->
    <path d="M415 367V442" class="hairline"/>
    <g class="mono">
      <text x="435" y="381" class="muted tiny">
        BUILD STATUS
      </text>
      <text x="435" y="405" class="white label">
        PRODUCTION READY
      </text>
      <circle cx="441" cy="425" r="4" fill="#7bdedb"
              filter="url(#softGlow)"/>
      <text x="453" y="429" class="cyan small">
        COMPILATION SUCCESSFUL
      </text>
    </g>

    <!-- Framework markers -->
    <path d="M710 367V442" class="hairline"/>
    <g class="mono">
      <text x="731" y="381" class="muted tiny">
        ACTIVE MODULES
      </text>

      <path d="M731 393H827V416H731Z"
            fill="#d9dfda" fill-opacity=".06"
            stroke="#d9dfda" stroke-opacity=".35"/>
      <text x="779" y="408" class="white small"
            text-anchor="middle">REACT</text>

      <path d="M837 393H933V416H837Z"
            fill="#d9dfda" fill-opacity=".06"
            stroke="#d9dfda" stroke-opacity=".35"/>
      <text x="885" y="408" class="white small"
            text-anchor="middle">NEXT.JS</text>

      <path d="M943 393H1057V416H943Z"
            fill="#ffb52e" fill-opacity=".08"
            stroke="#ffb52e" stroke-opacity=".75"/>
      <text x="1000" y="408" class="amber small"
            text-anchor="middle">TYPESCRIPT</text>

      <text x="731" y="436" class="muted tiny">
        INTERFACE LAYER / READY
      </text>
    </g>

    <!-- Warning strip -->
    <path d="M1077 369H1145V441H1077Z"
          fill="#ffb52e" fill-opacity=".08"
          stroke="#ffb52e" stroke-opacity=".65"/>
    <path d="M1087 380L1098 400H1076Z"
          fill="#ffb52e"/>
    <text x="1087" y="395" class="mono"
          font-size="10" fill="#111">!</text>
    <text x="1111" y="414" class="mono amber tiny"
          text-anchor="middle">CAUTION</text>
    <text x="1111" y="428" class="mono white tiny"
          text-anchor="middle">DEPLOY</text>
  </g>

  <!-- Calibration marks -->
  <g class="mono muted" font-size="8">
    <text x="40" y="91">N-01</text>
    <text x="1160" y="91" text-anchor="end">SECURE LINK</text>
    <text x="40" y="490">NERV / DEV INTERFACE</text>
    <text x="1160" y="490" text-anchor="end">BUILD 2026.10</text>
  </g>
</svg>
